name: Ithaca
description: 'Ithaca is a crypto-infrastructure company (backed by Paradigm) building open-source
  developer tooling to accelerate the crypto frontier. Its flagship product, Porto, is a TypeScript
  SDK for passwordless authentication and payments on the web — letting applications and wallets create,
  manage, and interact with next-generation Ethereum accounts (keychains with passkeys, permissions,
  subscriptions, and native cross-chain interoperability) without passwords, extensions, seed phrases,
  or API keys. The stack also includes the Account smart contracts (Solidity), the Relay cross-chain
  transaction router and RPC server (Rust) for EIP-7702 accounts, and Odyssey, an experimental open-source
  Layer 2 testnet. The Ithaca team has since joined Tempo (tempo.xyz), and the Porto product is sunsetting
  on 2026-07-24 with users moving to porto.sh.'
